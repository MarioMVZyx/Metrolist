name: Build ZYX APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zyx-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out ZYX
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload ZYX APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYX-debug-apk
          path: |
            androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
